<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício HTML e JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário EBAC</h1>
    <form id="meuFormulario">
        <label for="campoA">Campo A:</label>
        <input type="number" name="campoA" id="campoA" placeholder="Primeiro número">

        <label for="campoB">Campo B:</label>
        <input type="number" name="campoB" id="campoB" placeholder="Segundo número">

        <button type="submit">Enviar</button>
    </form>
    <p id="mensagem"></p>
    <script src="./script.js"></script>
</body>
</html>
